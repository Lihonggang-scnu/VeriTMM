[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritmm"
version = "1.0.0"
description = "An AI-ready, verifier-first transfer-matrix tool for multilayer optics"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "VeriTMM contributors"}]
keywords = [
  "optics", "thin-films", "transfer-matrix-method", "photonic-crystals",
  "inverse-design", "differentiable-physics", "refractive-index"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pydantic>=2.7",
  "tmm>=0.2.0",
]

[project.scripts]
veritmm = "tmm_engine.cli:main"

[project.optional-dependencies]
optimize = ["torch>=2.1"]
plot = ["matplotlib>=3.7"]
high_precision = ["mpmath>=1.3"]
test = ["pytest>=8", "jsonschema>=4.23", "tomli>=2.0; python_version < '3.11'"]
dev = [
  "pytest>=8", "jsonschema>=4.23", "build>=1.2", "ruff>=0.6",
  "tomli>=2.0; python_version < '3.11'",
]
all = [
  "torch>=2.1", "matplotlib>=3.7", "mpmath>=1.3", "pytest>=8", "jsonschema>=4.23",
  "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/Lihonggang-scnu/VeriTMM"
Repository = "https://github.com/Lihonggang-scnu/VeriTMM"
Issues = "https://github.com/Lihonggang-scnu/VeriTMM/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tmm_engine*", "benchmarks*"]

[tool.setuptools.package-data]
tmm_engine = ["materials/*.csv", "examples/*.json", "rii_cache.db"]
benchmarks = [
  "cases/*/*.json",
  "prompts/*",
  "trajectories/*.json",
  "expected/*",
  "scoring/*",
  "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "requires_torch: exercises the real PyTorch differentiable science path",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]
