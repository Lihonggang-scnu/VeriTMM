[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritmm"
version = "0.1.0"
description = "A verifier-first transfer-matrix workbench for multilayer optics and inverse design"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "VeriTMM contributors"}]
keywords = [
  "optics", "thin-films", "transfer-matrix-method", "photonic-crystals",
  "inverse-design", "differentiable-physics", "refractive-index"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "tmm>=0.2.0",
]

[project.optional-dependencies]
optimize = ["torch>=2.1"]
plot = ["matplotlib>=3.7"]
test = ["pytest>=8"]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.6"]
all = ["torch>=2.1", "matplotlib>=3.7", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/Lihonggang-scnu/VeriTMM"
Repository = "https://github.com/Lihonggang-scnu/VeriTMM"
Issues = "https://github.com/Lihonggang-scnu/VeriTMM/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tmm_engine*"]

[tool.setuptools.package-data]
tmm_engine = ["materials/*.csv", "rii_cache.db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
